name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (npm deps + headless Chrome) gets read-only;
# Pages write + OIDC live only on the deploy job that uses them
# (public-exposure audit 2026-08-13, finding A4-F7).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The internal render tier is only real if it is enforced: internal/ is
      # git-ignored and handed off locally, never committed (internalCanon,
      # ratified 2026-08-13).
      - name: internal/ is not tracked
        run: |
          if [ -n "$(git ls-files internal/)" ]; then
            echo "::error::internal/ artifacts are tracked — they are internal-tier and must stay out of the public tree."
            git ls-files internal/
            exit 1
          fi
      # Freshness guard: regenerate all derived artifacts (assets, AI formats,
      # PDF) from their sources so shipped output can never lag the canon.
      - run: npm run generate:all
      # Staleness check: the generators are deterministic, so a diff here means
      # a derived file was hand-edited or a brand.ts change shipped without a
      # regeneration. brand-guide.pdf and the PNG exports are excluded — their
      # bytes depend on the renderer build on this machine, not only on canon.
      - name: Derived artifacts match canon
        run: |
          PATHS=(. ':(exclude)public/brand-guide.pdf' ':(exclude)public/brand-assets')
          if ! git diff --quiet -- "${PATHS[@]}"; then
            echo "::error::Derived files are stale. Run npm run generate:all and commit the result."
            git diff --stat -- "${PATHS[@]}"
            exit 1
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
